<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>错题整理 · __MODE__</title>
<style>
:root{--ink:#141414;--mid:#5a5a5a;--line:#dcdcdc;--soft:#f6f6f4;--red:#c0392b;--green:#1e6b3a;}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Noto Sans SC",sans-serif;}
body{padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px;letter-spacing:.5px}
.sub{font-size:12px;color:var(--mid)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;
  font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{background:var(--ink);color:#fff}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{opacity:.85}
.btn.mini{padding:5px 9px;font-size:11.5px;border-color:var(--line);color:var(--mid)}
.btn.mini:hover{background:var(--soft);color:var(--ink);border-color:var(--ink)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.red:hover{background:var(--red);color:#fff}
.sec{margin-top:22px}
.sec-h{font-size:12px;letter-spacing:1.2px;color:var(--mid);border-bottom:1px solid var(--line);
  padding-bottom:6px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
/* 样张 */
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.smp{border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:#fff;padding:0}
.smp img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
.smp:hover{border-color:var(--ink)}
.smp .nm{font-size:10px;color:var(--mid);padding:3px 5px;text-align:left}
/* 匹配 */
.match{border:1px solid var(--ink);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.match .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mid);margin-bottom:8px}
.cand{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.cand img{width:64px;height:46px;object-fit:cover;object-position:top left;border:1px solid var(--line);border-radius:4px;background:#fafafa}
.cand .txt{flex:1;font-size:12.5px;line-height:1.5}
.cand .sc{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mid)}
.pill{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--mid);margin-right:4px}
.pill.hi{border-color:var(--green);color:var(--green)}
.pill.md{border-color:#b8860b;color:#b8860b}
/* 卡片 */
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
.card .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.no{font-weight:700;font-size:12.5px}
.pk{font-family:"Noto Serif CJK SC",Georgia,serif;font-size:14px;line-height:1.7;margin:2px 0 8px}
.pk img{width:100%;max-width:640px;border:1px solid #eee;border-radius:4px;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px;color:var(--mid)}
.kv b{color:var(--ink);font-weight:500}
.edit{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.card.open .edit{display:block}
label.f{display:block;font-size:11px;color:var(--mid);margin:8px 0 3px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:7px 9px;
  font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:44px}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;color:var(--mid)}
.tag.on{border-color:var(--ink);color:var(--ink);background:var(--soft)}
.tag.off{opacity:.45;text-decoration:line-through}
/* 统计 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.st .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.st .l{font-size:11px;color:var(--mid)}
.bars{margin-top:8px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mid);margin:4px 0}
.bar-row .b{height:6px;background:var(--ink);border-radius:3px}
.empty{color:var(--mid);font-size:12.5px;padding:22px 0}
.hint{font-size:11.5px;color:var(--mid);line-height:1.6;margin-top:6px}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--mid)}
.tab.on{border-color:var(--ink);color:var(--ink)}
@media print{
  @page{size:A4;margin:8mm 10mm 12mm}
  body{padding:0;max-width:none}
  .bar,.samples,.match,.tabs,.stats,.hint,.edit,.sec-h,.btn{display:none!important}
  .cards{gap:4mm}
  .card{break-inside:avoid;border:.6pt solid #bbb;border-radius:0;padding:3.6mm 4mm}
  .pk img{max-width:100%}
  .kv{font-size:8.6pt}
  h1{font-size:12pt;margin-bottom:6mm}
  .sub{display:none}
  .card{position:relative}
  .card::before,.card::after{content:"";position:absolute;width:5mm;height:5mm}
  .card::before{top:-1px;left:-1px;border-top:.7pt solid #444;border-left:.7pt solid #444}
  .card::after{bottom:-1px;right:-1px;border-bottom:.7pt solid #444;border-right:.7pt solid #444}
}
@media (max-width:560px){ body{padding:12px} .kv{grid-template-columns:1fr} }
</style>
</head>
<body>
<h1>错题整理 <span style="font-size:11px;color:#5a5a5a;font-weight:400">· 图库匹配版</span></h1>
<div class="sub" id="subline"></div>

<div class="bar">
  <button class="btn solid" id="btnCam">拍照 / 选图</button>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
  <button class="btn" id="btnPrint">导出 PDF（A4 打印）</button>
  <button class="btn" id="btnJson">导出 notebook.json</button>
  <button class="btn mini" id="btnClear">清空</button>
</div>
<div class="hint" id="hint"></div>

<div class="sec" id="secSamples">
  <div class="sec-h"><span>演示样张（模拟手机拍摄：歪斜 + 红笔手写 + JPEG 压缩）</span><span id="smpCount"></span></div>
  <div class="samples" id="samples"></div>
</div>

<div id="matchBox"></div>

<div class="sec">
  <div class="sec-h"><span>错题卡</span><span id="cardCount"></span></div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-f="all">全部</div>
    <div class="tab" data-f="chem">化学</div>
    <div class="tab" data-f="phys">物理</div>
    <div class="tab" data-f="math">数学</div>
  </div>
  <div class="cards" id="cards"></div>
</div>

<div class="sec">
  <div class="sec-h"><span>统计</span><span>数据存本地 localStorage</span></div>
  <div class="stats" id="stats"></div>
  <div class="bars" id="bars"></div>
</div>
